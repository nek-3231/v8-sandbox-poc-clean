name: KVM-KASAN-Pipeline

on: [push]

jobs:
  build-fuzz-env:
    runs-on: ubuntu-latest
    steps:
      - name: Install Toolchain & Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libelf-dev libssl-dev bc bison flex libncurses-dev cpio wget git

      - name: Clone & Config Kernel (KASAN+KVM)
        run: |
          git clone --depth=1 https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git kernel
          cd kernel
          make defconfig
          ./scripts/config --enable KVM \
                           --enable KVM_INTEL \
                           --enable KVM_AMD \
                           --enable KASAN \
                           --enable KASAN_INLINE \
                           --enable KASAN_STACK
          make -j$(nproc) bzImage
          cp arch/x86/boot/bzImage $GITHUB_WORKSPACE/bzImage

      - name: Build BusyBox Static Rootfs
        run: |
          mkdir -p $GITHUB_WORKSPACE/rootfs && cd $GITHUB_WORKSPACE/rootfs
          wget -qO- https://busybox.net/downloads/busybox-1.36.1.tar.bz2 | tar -xj
          cd busybox-1.36.1
          make defconfig
          sed -i 's/# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
          make -j$(nproc) install
          cd _install
          mkdir -p proc sys dev etc etc/init.d
          echo -e '#!/bin/sh\nmount -t proc none /proc\nmount -t sysfs none /sys\nsetsid cttyhack sh' > etc/init.d/rcS
          chmod +x etc/init.d/rcS
          find . | cpio -o --format=newc | gzip -9 > $GITHUB_WORKSPACE/rootfs.cpio.gz

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-assets
          path: |
            bzImage
            rootfs.cpio.gz
